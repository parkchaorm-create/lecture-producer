name: neo-tech
displayName: Neo-Tech · 사이버 네온 블루
version: 1.0.0
variant: dark
author: lecture-producer
license: MIT
compatibleVersion: ">=1.0.0"

description: |
  개발자·테크 타겟 다크 테마. 딥 네이비(#0a0e27) 배경 + 시안 네온(#00d4ff) 악센트.
  모노스페이스 코드 친화 · NETWORK 배경 애니메이션으로 그래프 분위기.
  유튜브 개발 채널·해커톤·DevOps·AI 코딩 강의에 적합.

requiredFonts:
  - family: Pretendard Variable
    cdn: https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css
    fallback: ['JetBrains Mono', 'Fira Code', '-apple-system', 'BlinkMacSystemFont', 'sans-serif']

files:
  tokens: tokens.json
  styles: common.css
  scripts: common.js

backgroundModes: [FLOW, WAVES, VORONOI, NETWORK, CONSTELLATION]
defaultBackgroundMode: NETWORK
