# Pajamaboss Theme — lecture-producer 기본 테마
name: pajamaboss
displayName: Pajamaboss · 럭셔리 다크 골드
version: 1.0.0
variant: dark
author: lecture-producer
license: MIT
compatibleVersion: ">=1.0.0"

description: |
  검증된 프로덕션 급 럭셔리 다크 골드 디자인 시스템.
  --gold(#e2c793) + --black(#0D0D0D) + Pretendard Variable.
  40대 시인성 최적화(본문 19px·detail 16px) + WCAG AA 대비 통과.
  SVG 9 아키타입 호환. CSS-vs-SVG transform 충돌 차단(svg-design.md 불변 0조).

requiredFonts:
  - family: Pretendard Variable
    cdn: https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css
    fallback: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'sans-serif']

files:
  tokens: tokens.json
  styles: common.css
  scripts: common.js

backgroundModes: [FLOW, WAVES, VORONOI, NETWORK, CONSTELLATION]
defaultBackgroundMode: FLOW

# 신규 테마 작성 가이드
# 1. 이 폴더(assets/themes/pajamaboss/)를 통째로 복사해 새 이름으로 변경
# 2. tokens.json의 palette·typography·fontSize 수정 (구조는 유지)
# 3. theme.yaml의 name·displayName·author·license 수정
# 4. common.css·common.js는 var(--*)만 참조하므로 보통 손댈 필요 없음
# 5. .claude/scripts/theme-lint.mjs 실행으로 하드코딩 검출
